# เปลี่ยนส่วนของการ Install dependencies
      - name: Install dependencies
        run: pip install google-search-results

      # เพิ่มตัวแปร Environment ให้ Python มองเห็น Secrets
      - name: Run Scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scholar_scraper.py
