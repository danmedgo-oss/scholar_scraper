name: Daily Scholar Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# เพิ่มบล็อก permissions นี้เพื่อให้บอทมีสิทธิ์เขียนไฟล์ได้โดยตรงผ่านโค้ด
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # อัปเดตจาก @v3 เป็น @v4 เพื่อแก้ Warning
      - name: Checkout repository
        uses: actions/checkout@v4

      # อัปเดตจาก @v4 เป็น @v5 เพื่อแก้ Warning
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install scholarly
        run: pip install scholarly

      - name: Run Scraper
        run: python scholar_scraper.py

      - name: Commit and push JSON data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add scholar_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scholar data [skip ci]" && git push)
