name: Daily Scholar Scraper

on:
  schedule:
    # รันวันละ 1 ครั้ง เวลา 07:00 เช้า (เวลาไทย)
    - cron: '0 0 * * *'
  # ปุ่มกดรันเองสำหรับตอนต้องการทดสอบ
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install scholarly
        run: pip install scholarly

      - name: Run Scraper
        run: python scholar_scraper.py

      - name: Commit and push JSON data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add scholar_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scholar data [skip ci]" && git push)
